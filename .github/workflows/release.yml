name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        # Users need the whole repo (install.sh, native-host/, keys/), not
        # just extension/ -- the extension itself now ships via the Chrome
        # Web Store. git archive only includes tracked files, so the
        # gitignored private key (never committed) can't end up in it.
        run: git archive --format=zip -o "kget-capture-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: kget-capture-${{ github.ref_name }}.zip
          generate_release_notes: true
