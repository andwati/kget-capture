name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          cd extension
          zip -r "../kget-capture-${GITHUB_REF_NAME}.zip" .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: kget-capture-${{ github.ref_name }}.zip
          generate_release_notes: true
