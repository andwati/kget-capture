<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>KGet Capture</h1>
  <label class="toggle-row">
    <input type="checkbox" id="auto-capture-toggle">
    <span>Auto-capture all downloads</span>
  </label>
  <p class="status" id="status-line"></p>
  <p class="hint">Right-click any link, image, video, or audio and choose
    "Download with KGet" to send it to KGet on demand.</p>
  <script src="popup.js"></script>
</body>
</html>
